name: Llama

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  analysis-report:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'llama-analysis'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install Reaper and Graphify
        run: |
          uv sync --locked
          uv pip install graphifyy==0.9.95
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Download test model
        run: |
          mkdir -p "$RUNNER_TEMP/reaper-models"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/reaper-models/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf" \
            https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf

      - name: Pull llama.cpp server image
        run: docker pull ghcr.io/ggml-org/llama.cpp:server

      - name: Run evidence workflow
        run: |
          scripts/reaper-workflow.sh \
            --runtime docker \
            --model "$RUNNER_TEMP/reaper-models/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf"

      - name: Validate reports
        run: |
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path

          from reaper.utils.graph import analysis_candidates, load_graph

          graph_path = Path("reaper-analysis/graphify-out/graph.json")
          report_path = Path("reaper-analysis/reaper-report.json")
          markdown_path = Path("reaper-analysis/reaper-report.md")
          prompt_path = Path("reaper-analysis/refactor-prompt.md")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          nodes, edges = load_graph(graph_path)
          findings = report["findings"]
          summary = report["summary"]

          assert report["schema_version"] == 1
          assert findings
          assert summary["reviewed"] == len(findings)
          assert summary["reviewed"] == len(analysis_candidates(nodes, edges))
          assert summary["reviewed"] == sum(
              summary[key]
              for key in ("likely_dead", "needs_review", "likely_used")
          )
          assert markdown_path.read_text(encoding="utf-8").strip()
          prompt = prompt_path.read_text(encoding="utf-8")
          assert "# Reaper evidence-based refactoring prompt" in prompt
          PY

      - name: Publish report summary
        run: |
          cat reaper-analysis/reaper-report.md
          cat reaper-analysis/reaper-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        uses: actions/upload-artifact@v7
        with:
          name: reaper-analysis-report
          path: |
            reaper-analysis/reaper-report.json
            reaper-analysis/reaper-report.md
            reaper-analysis/refactor-prompt.md
            reaper-analysis/llama-server.log
          retention-days: 7

      - name: Show llama.cpp logs on failure
        if: failure()
        run: cat reaper-analysis/llama-server.log || true
